title: Analytics
author: Analytics
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, bootcamp.scss, layout-helpers.scss]
      template-partials:
        - title-slide.html
      transition: none
      background-transition: none
      slide-transition: none
      auto-animate: false
      fragments: false
      slide-number: c/t
      chalkboard: false
      preview-links: auto
      width: 1200
      height: 675
      margin: 0.08
      center: false
      navigation-mode: linear
      controls-tutorial: false
      code-line-numbers: false
      fig-align: center
      fig-width: 8
      fig-height: 4.2
