title: DECDI Presentation Template
version: 0.0.1
quarto-required: ">=1.3.361"
contributes:
  formats:
    revealjs:
      footer: |
        "DECDI theme for [Quarto Presentations](https://quarto.org/docs/presentations/revealjs/index.html)."
      theme: decdi.scss
      slide-number: c/t
      highlight-style: atom-one
      show-slide-number: all
      title-slide-attributes:
        data-background-color: "#FFFFFF"
      preview-links: true
      include-in-header: favicon.html
      include-after-body: logo-visibility.html
# Colors and fonts synchronized from the skill's branding/colors.yml.
