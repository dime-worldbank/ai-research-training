# Bootcamp agenda — single source for /bootcamp/ and each day page.
# Session fields: time, title, lead, hands_on, kind (break|lunch|welcome), link (site path or https URL), external.
name: AI-Enabled Research Bootcamp
dates: Oct 1 & Oct 5–8, 2026
agenda_url: https://www.canva.com/design/DAHT37UVp3k/z8gvUN_hMD0hSYwGE1qYGw/edit
intro:
- 'Artificial intelligence is changing how research is done. This bootcamp puts AI
  capabilities directly into the hands of WBG researchers. Over four days, participants
  move through the full research lifecycle: building confidence with agentic AI and
  directing it responsibly; transforming how they collect, clean, and analyze data;
  producing polished, reproducible, publication-ready research outputs; and, for those
  ready to go further, designing advanced workflows that scale across teams.'
- Every session is grounded in tools already available at the WBG, and more than half
  are hands-on. Participants leave with reusable workflows, memory files, and AI skills
  configured for their own research. No prior AI experience is required.
