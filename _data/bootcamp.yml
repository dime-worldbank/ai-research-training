    is already possible at the WBG, and how to put it to work immediately. They learn
    to onboard agents to a research project using memory files and reusable skills,
    direct them with effective prompting, and use them responsibly: cost and efficiency
    trade-offs, WBG ethics and governance requirements, and human-in-the-loop evaluation
