# Bootcamp agenda — single source for /bootcamp/ and each day page.
# Session fields: time, title, lead, hands_on, kind (break|lunch|welcome), link (site path or https URL), external,
# materials (list of {label, url}: files and repos participants use in the session; shown as small buttons in the Materials column,
# so keep each label to 1–2 short words, and add 🔒 when it needs a World Bank login;
# url is a full https URL or a site path like /bootcamp/...; .zip files are not published on the site, so link them via github.com/.../raw/...).
name: AI-Enabled Research Bootcamp
dates: Oct 1 & Oct 5–8, 2026
agenda_url: "https://www.canva.com/design/DAHT37UVp3k/MqhtbPu8GPBX2F0ywXmRaQ/view?utm_content=DAHT37UVp3k&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h232f439bda"
intro:
- 'Artificial intelligence is changing how research is done. This bootcamp puts AI
  capabilities directly into the hands of WBG researchers. Over four days, participants
  move through the full research lifecycle: building confidence with agentic AI and
  directing it responsibly; transforming how they collect, clean, and analyze data;
  producing polished, reproducible, publication-ready research outputs; and, for those
  ready to go further, designing advanced workflows that scale across teams.'
- Every session is grounded in tools already available at the WBG, and more than half
  are hands-on. Participants leave with reusable workflows, memory files, and AI skills
  configured for their own research. No prior AI experience is required.
ai_disclosure:
  title: AI disclosure
  paragraphs:
  - 'These materials were developed with assistance from generative AI tools, specifically
    Claude (Anthropic), including Claude Sonnet 5.5, Claude Opus 5.5, and Claude Sonnet 5,
    and potentially other AI models. AI supported drafting, editing, restructuring,
    example creation, and testing. The Impact Analytics team reviewed and revised all
    materials and is responsible for the final content. Each skill lists its relevant sources.'
  - 'Some of the materials and skills shown in this training are work in progress and rapidly evolving. To share feedback, please open a GitHub issue
    or email <a href="mailto:dimeanalytics@worldbank.org">dimeanalytics@worldbank.org</a>.'
