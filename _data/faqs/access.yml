- id: claude-code-bootcamp-access
  title: "How can I keep using Claude Code Enterprise after the Bootcamp?"
  answer: |
    You can use the $10 credit provided as part of the Bootcamp until the end of the month. If you need additional credits now or want to receive credits in future months, submit this [eServices request 🔒](https://worldbankgroup.service-now.com/wbg/en/productivity-software-license-request?id=wbg_sc_catalog&sys_id=ebfd4d6693065210a2f6fd647aba10d7). Speak to your manager first as you will need managerial approval and provide a charge code.

- id: claude-code-new-access
  title: "How can users who did not attend the Bootcamp get access to Claude Code Enterprise?"
  answer: |
    Claude has recently been approved for use at the World Bank but is not yet generally available. The responsible ITS team is rolling out access and has agreed to include all Bootcamp participants in the initial rollout. The ITS team has not shared a timeline for making it available to more users.
