- id: replit
  title: "How can I keep using Replit after the Bootcamp?"
  coming_soon: true
  answer: |
    Licenses for Replit cost $1200 per year. Licenses can be reassigned to another team member within the same unit once the original user completes their work. Impact Analytics has agreed to aggregate requests for Replit licenses so ITS can process in one batch. If the license cost is cleared by your Manager, email [Impact Analytics](mailto:dimeanalytics@worldbank.org) with email subject "Replit License Request", and a brief description of the use case (2-3 sentences). If you are requesting on behalf of someone else, include the name of the staff member who should receive the license.

- id: claude-code-bootcamp-access
  title: "How can I keep using Claude Code Enterprise after the Bootcamp?"
  answer: |
    You can use the credits provided as part of the Bootcamp until the end of October. If you need additional credits now or want to extend access and receive credits in future months, submit this [eServices request 🔒](https://worldbankgroup.service-now.com/wbg/en/productivity-software-license-request?id=wbg_sc_catalog&sys_id=ebfd4d6693065210a2f6fd647aba10d7). Future token costs will be charged to BB of your unit. The form includes the required manager approval workflow. Once approved, credits are applicable to all WB approved Claude products, including Claude Code.

- id: claude-code-new-access
  title: "How can users who did not attend the Bootcamp get access to Claude Code Enterprise?"
  answer: |
    Claude has recently been approved for use at the World Bank but is not yet generally available. The responsible ITS team is rolling out access and has agreed to include all Bootcamp participants in the initial rollout. The ITS team has not shared a timeline for making it available to more users.
