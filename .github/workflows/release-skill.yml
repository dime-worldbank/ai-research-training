name: Release AI Skills

# Fires when a push to main touches a skill folder (`skills/<skill-name>/`
# anywhere in the repo). Each changed skill gets its OWN release, tagged
# `<skill-name>-latest`, with a single `<skill-name>.zip` attached. The release
# is replaced on every change, so this URL never changes:
#
#   https://github.com/<org>/<repo>/releases/download/<skill-name>-latest/<skill-name>.zip
#
# Run manually from the Actions tab to (re)publish every skill.
on:
  push:
    branches:
      - main
    paths:
      - "**/skills/*/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A skill is a folder with a SKILL.md directly inside a `skills/` folder.
      - name: Find skills to release
        id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(find . -path ./.git -prune -o -path '*/skills/*/SKILL.md' -print \
                | sed 's#^\./##; s#/SKILL.md$##' | sort)

          zeros="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zeros" ]; then
            changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            todo=""
            for dir in $all; do
              if echo "$changed" | grep -q "^$dir/"; then todo="$todo$dir"$'\n'; fi
            done
          else
            todo="$all"
          fi

          echo "Skills to release:"; printf '%s' "$todo"
          {
            echo "dirs<<EOF"
            printf '%s' "$todo"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Zip and release each skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            name=$(basename "$dir")
            tag="${name}-latest"

            (cd "$(dirname "$dir")" && zip -qr "$RUNNER_TEMP/dist/$name.zip" "$name" -x '*.DS_Store')

            # Replace the previous release (and move the tag) so the URL is stable.
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" "$RUNNER_TEMP/dist/$name.zip" \
              --target "${{ github.sha }}" \
              --title "$name (latest)" \
              --notes "Latest version of the \`$name\` skill, built from \`$dir\` at ${GITHUB_SHA::7}.

          Download \`$name.zip\`, unzip it, and drop the \`$name\` folder into your project's skills directory (for example \`.agents/skills/\`)." \
              --latest=false
          done <<< "${{ steps.find.outputs.dirs }}"
